name: Python Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install uv
          uv sync
          uv run playwright install --with-deps

      - name: Run Ruff Check
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Pylint
        run: uv run pylint --load-plugins pylint_pytest tests/ pages/ utils/

      - name: Run Tests
        timeout-minutes: 30  
        env:
          ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
          ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
          ORANGEHRM_BASE_URL: ${{ secrets.ORANGEHRM_BASE_URL }}
        run: uv run pytest --maxfail=1 --disable-warnings --alluredir=allure-results

      - name: Upload Test Artifacts
        if: always()    # upload even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            report.html
            videos/
            trace.zip
          retention-days: 7

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
